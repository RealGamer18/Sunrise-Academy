<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunrise Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0b131c; --panel:#121e2b; --panel-2:#182739; --line:#2a3d52;
  --gold:#d9a441; --gold-soft:#d9a44122; --ink:#ece3cf; --ink-2:#b9b09c; --muted:#8792a0;
  --good:#79c29a; --bad:#e0735c; --abs:#b98cf0;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --body:"IM Fell English",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;
  background:radial-gradient(900px 500px at 80% -10%,#2b2a4a55,transparent 60%),var(--ground)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header.top h1{font-family:var(--display);color:var(--gold);font-size:26px;letter-spacing:.06em;margin:0}
header.top span{color:var(--muted);font-size:14px}
.langbtn{margin-left:auto}
h2{font-family:var(--display);color:var(--gold);font-size:21px;margin:0 0 12px;letter-spacing:.03em}
h3{font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--ink-2);margin:0 0 8px;font-weight:500;text-transform:uppercase}
h3.sub{margin-top:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px clamp(14px,3vw,26px);margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{font-family:var(--display);font-size:13px;letter-spacing:.05em;border-radius:4px;padding:10px 16px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:#2c6b58;border-color:#3f8c74}
.btn.primary:hover:not(:disabled){background:#34806a}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:#e0735c66}
.btn.small{padding:6px 10px;font-size:12px}
.link{background:none;border:0;color:var(--gold);cursor:pointer;font-family:var(--body);font-size:15.5px;padding:0;text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted);font-style:italic}
.note{color:var(--ink-2);font-size:15px;font-style:italic}
.lead{margin:0 0 12px;color:var(--ink)}
.warn{border:1px solid #e0735c66;background:#e0735c14;color:#f1b2a4;border-radius:4px;padding:10px 12px;margin-bottom:12px}
.warn.inline{padding:6px 10px;margin:0}
.pill{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);margin-left:4px}
.pill.ok{border-color:#79c29a88;color:var(--good)}
.pill.abs{border-color:#b98cf088;color:var(--abs)}
input,textarea,select{font:inherit;color:var(--ink);background:#0e1824;border:1px solid var(--line);border-radius:4px;padding:9px 11px;width:100%}
select{width:auto;min-width:220px;max-width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
.f{display:block;margin-bottom:12px;color:var(--ink-2);font-size:15px}
.f > input,.f > textarea,.f > .row{margin-top:5px}
.check{display:flex;gap:8px;align-items:center;margin:10px 0;cursor:pointer}
.check input{width:auto;accent-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.die{font-family:var(--display);font-size:12.5px;letter-spacing:.04em;border:1px solid #d9a44188;background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.die:hover{background:#d9a44138}
.roll{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:16.5px}
.rv{font-family:var(--display);font-size:26px;color:var(--gold);min-width:52px;text-align:center;border:1px solid var(--gold);border-radius:6px;padding:4px 8px}
.big{font-family:var(--display);font-size:40px;color:var(--gold);display:flex;align-items:baseline;gap:10px;margin:10px 0}
.big small{font-size:14px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px}
.rc{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:10px 12px;cursor:pointer;font-family:var(--body)}
.rc b{display:block;font-family:var(--display);font-size:14.5px;letter-spacing:.03em;margin-bottom:3px}
.rc small{color:var(--ink-2);font-size:13.5px;line-height:1.35}
.rc:hover{border-color:#d9a44188}
.rc.sel{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--panel-2))}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin-top:10px}
.card.mini{padding:10px 12px}
.card h3{color:var(--gold);font-size:15px}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 10px}
dt{color:var(--muted);font-size:14.5px}
dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#0e1824;color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--body);font-size:14.5px}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.tt{border-collapse:collapse;width:100%;font-size:15px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.tt th{text-align:left;color:var(--muted);font-weight:400;border-bottom:1px solid var(--line);padding:5px 6px}
.tt td{padding:5px 6px;border-bottom:1px solid #1d2c3c}
.tt tr.hit td{background:var(--gold-soft);color:var(--gold)}
.attrs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.attr{display:grid;grid-template-columns:1fr auto 110px;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 12px}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl button{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);background:#0e1824;color:var(--ink);font-size:18px;cursor:pointer}
.ctrl button:hover{border-color:var(--gold)}
.ctrl b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.at{text-align:right;font-variant-numeric:tabular-nums}
.at b{font-family:var(--display);font-size:18px;color:var(--gold);margin-left:8px}
.at small{color:var(--muted)}
.steps{list-style:none;padding:0;margin:12px 0 18px;display:flex;flex-wrap:wrap;gap:4px}
.steps button{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-family:var(--body);font-size:13.5px;cursor:pointer}
.steps button.done{color:var(--ink-2);border-color:#3f8c7488}
.steps button.cur{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.stepbody{min-height:180px}
.nav{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.story{margin:8px 0 0;font-style:italic;color:var(--ink-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cc{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:14px;color:var(--ink);cursor:pointer;font-family:var(--body);display:flex;flex-direction:column;gap:4px}
.cc:hover{border-color:var(--gold)}
.cc b{font-family:var(--display);font-size:17px;color:var(--gold)}
.cc small{color:var(--ink-2)}
.cc span{color:var(--muted);font-size:14px}
.sheet{margin-top:14px}
.sh-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.sh-head h2{font-size:26px;margin-bottom:4px}
.sh-head p{margin:0;color:var(--ink-2)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.sh-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.sh-grid{grid-template-columns:1fr}}
.sh-grid section{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:12px 14px}
.sh-grid section.wide{grid-column:1/-1}
.sh-grid section.private{border-color:#b98cf066}
.sh-grid p{margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{background:#0e1824;border:1px solid var(--line);border-radius:4px;padding:6px 4px;text-align:center}
.st b{display:block;font-family:var(--display);font-size:19px;color:var(--gold)}
.st small{font-size:11.5px;color:var(--muted);line-height:1.2;display:block}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.res div{display:flex;justify-content:space-between;border-bottom:1px solid #1d2c3c;padding:3px 0;font-variant-numeric:tabular-nums}
.res span{color:var(--muted)}
.afi{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);padding:12px 18px;border-radius:5px;max-width:calc(100% - 32px);z-index:5}

/* ===== juego ===== */
.ccw{display:flex;flex-direction:column;gap:6px}
.ccw .cc{flex:1}
.ccw .play{align-self:stretch}
.hero-cta{border-color:#d9a44166;background:linear-gradient(180deg,#d9a44112,var(--panel))}
.hero-cta h3{margin:0 0 2px}
.big2{font-family:var(--display);font-size:20px;color:var(--gold)}
body.ingame .wrap{max-width:1180px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hud{display:grid;grid-template-columns:minmax(180px,1fr) 2fr minmax(180px,1fr);gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:10px}
@media (max-width:820px){.hud{grid-template-columns:1fr}}
.hud .who b{display:block;font-family:var(--display);font-size:18px;color:var(--gold)}
.hud small{display:block;color:var(--ink-2);font-size:13.5px}
.meters{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;font-variant-numeric:tabular-nums}
.meters span{display:flex;flex-direction:column;min-width:120px}
.where{font-size:14px;color:var(--ink-2)}
.bar{display:block;height:6px;border-radius:3px;background:#0e1824;border:1px solid var(--line);overflow:hidden;margin-top:3px;min-width:90px}
.bar i{display:block;height:100%;transition:width .3s}
.bar.pv i{background:#d0584a}.bar.mn i{background:#5a8ee0}.bar.en i{background:#79c29a}.bar.xp i{background:var(--gold)}
.gtabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.gtabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);border-radius:5px;padding:8px 14px;font-family:var(--display);font-size:13px;letter-spacing:.04em;cursor:pointer}
.gtabs button.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:12px 0}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:10px 12px;cursor:pointer;font-family:var(--body);display:flex;flex-direction:column;gap:2px}
.act b{font-family:var(--display);font-size:14px;letter-spacing:.02em;font-weight:500}
.act small{color:var(--ink-2);font-size:13.5px}
.act:hover:not(:disabled){border-color:var(--gold)}
.act:disabled{opacity:.5;cursor:default}
.act.sel{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--panel-2))}
.result{border:1px solid #d9a44188;background:var(--gold-soft);border-radius:5px;padding:12px 14px;margin-bottom:14px}
.result b{color:var(--gold);font-family:var(--display);font-size:14.5px}
.result > div{margin-top:3px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin:8px 0 14px}
.pl{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;background:#0e1824;border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:8px 10px;cursor:pointer;font-family:var(--body);font-size:14.5px}
.pl small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pl:hover:not(:disabled){border-color:var(--gold)}
.pl:disabled{border-color:var(--gold);color:var(--gold);cursor:default}
.shop{display:flex;flex-direction:column;gap:6px}
.si{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #1d2c3c;padding:6px 0;flex-wrap:wrap}
.si span{display:flex;flex-direction:column;flex:1;min-width:180px}
.si small{color:var(--ink-2);font-size:13.5px}
.si select{min-width:160px}
.free{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.free textarea{margin:6px 0 8px}
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0}
.foe{background:var(--panel-2);border:1px solid #e0735c66;border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.foe b{font-family:var(--display);color:#f1b2a4}
.foe small{color:var(--ink-2)}
.foe.dead{opacity:.45}
.foe .st{color:var(--abs)}
.spells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-bottom:10px}
.cm{margin:10px 0}
.clog{max-height:260px;overflow:auto;background:#0e1824;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.mapwrap{grid-template-columns:1fr}}
.minimap{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;aspect-ratio:1080/1024}
.minimap img,.minimap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.minimap .hot{fill:transparent;stroke:transparent;stroke-width:4;cursor:pointer}
.minimap .hot:hover{fill:#d9a4411a;stroke:#d9a44188}
.minimap .hot.sel{fill:#d9a44122;stroke:var(--gold)}
.bar.fv i{background:#e8c86a}
.card.god{border-color:#d9a44155}
.card.god.dark{border-color:#b98cf066;background:linear-gradient(180deg,#b98cf012,var(--panel-2))}
.card.god .row span{display:flex;align-items:center;gap:8px}
details.card summary{cursor:pointer;font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.treewrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.treewrap{grid-template-columns:1fr}}
.hextree{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 50%,#d9a44114,transparent 70%);border:1px solid var(--line);border-radius:6px}
.hx{cursor:pointer}
.hx polygon{fill:#0e1824;stroke:#2a3d52;stroke-width:1.5;transition:fill .15s}
.hx text{fill:var(--muted);font-family:var(--body);font-size:8.5px;text-anchor:middle;pointer-events:none}
.hx text.ic{font-size:11px}
.hx.off{opacity:.45}
.hx.can polygon{stroke:var(--gold);stroke-dasharray:4 3;stroke-width:2}
.hx.can text{fill:var(--ink)}
.hx.near polygon{stroke:#d9a44166;stroke-dasharray:2 3}
.hx.on polygon{fill:#d9a44133;stroke:var(--gold);stroke-width:2}
.hx.on text{fill:var(--gold)}
.hx.on.puerta polygon,.hx.on.maestro polygon{fill:#b98cf040;stroke:var(--abs)}
.hx.on.puerta text,.hx.on.maestro text{fill:#d9c2f7}
.hx.maestro polygon{stroke-width:2.5}
.hx.centro polygon{fill:#d9a44166;stroke:var(--gold);stroke-width:2.5}
.hx.centro text{fill:#fff3d6}
.hx:hover polygon,.hx.sel polygon{stroke:#fff;stroke-width:2.5}
.hx:focus{outline:none}.hx:focus-visible polygon{stroke:#fff;stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2);margin:10px 0 4px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);background:#0e1824}
.lg.on{background:#d9a44133;border-color:var(--gold)}.lg.can{border:2px dashed var(--gold)}.lg.near{border:1.5px dashed #d9a44166}.lg.off{opacity:.45}
.pausebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:10px 14px;margin-bottom:14px}
.pausebar.on{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--panel-2))}
/* ===== combate ===== */
.battle{display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.bhead .turn{color:var(--gold)}
.stage{position:relative;border-radius:8px;border:1px solid var(--line);overflow:hidden;min-height:340px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg,#0b131c33 0%,#0b131c10 40%,#0b131c99 62%,#0b131cee 100%),var(--bgimg,none) center 40%/cover no-repeat,linear-gradient(180deg,var(--bg1),var(--bg2))}
.foes2{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap}
.foe2{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font-family:var(--body);min-width:170px}
.foe2:disabled{cursor:default}
.foe2.dead{opacity:.35;filter:grayscale(1)}
.plate{background:#0b131cdd;border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:180px;text-align:left;box-shadow:0 4px 14px #0006}
.foe2.tgt .plate{border-color:#e0735c;box-shadow:0 0 0 2px #e0735c55,0 4px 14px #0006}
.pn{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pn b{font-family:var(--display);font-size:14px;letter-spacing:.02em}
.pn span{font-size:12px;color:var(--ink-2)}
.pv{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.aff{color:var(--gold)}
.hp{display:block;height:8px;border-radius:4px;background:#1b2635;border:1px solid #2a3d52;overflow:hidden;margin:4px 0 2px;flex:1;min-width:90px}
.hp i{display:block;height:100%;background:#58c47d;transition:width .6s ease}
.hp.mid i{background:#e2b93b}.hp.low i{background:#e0584a}
.hp.mp i{background:#5a8ee0}.hp.en i{background:#79c29a}
.lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--display);letter-spacing:.05em}
.sts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stc{font-size:11.5px;border:1px solid #b98cf066;color:#d9c2f7;border-radius:999px;padding:1px 7px}
.stc.buff{border-color:#79c29a66;color:#a8e0bf}
.sprite{position:relative;width:96px;height:96px;display:grid;place-items:center}
.sprite span{font-size:58px;line-height:1;filter:drop-shadow(0 6px 6px #0008);animation:bob 2.6s ease-in-out infinite;z-index:1}
.sprite.boss span{font-size:76px}
.sprite.boss{width:120px;height:120px}
.sprite .pad{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:90%;height:18px;border-radius:50%;background:radial-gradient(#00000088,transparent 70%)}
.me2{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sprite.me span{transform:scaleX(-1)}
.hit .sprite span{animation:shake .45s ease 1,bob 2.6s ease-in-out .45s infinite}
